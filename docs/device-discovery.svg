<polyline points="1110.0,1810 270.0,1810" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="43" y="51.5" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="600" fill="#172b4d">03 · 入网、地址发现、教师接管与画面订阅</text>
<text x="43" y="91.95" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#172b4d">设备 ID 是身份；IP 是地址。学生主动建立控制与画面连接；只读教师的画面订阅不赋予控制权。</text>
<rect x="70.0" y="145" width="400.0" height="80" rx="10" fill="#e8effa" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="270.0" y="192.0" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="600" fill="#172b4d">教师 Electron</text>
<rect x="490.0" y="145" width="400.0" height="80" rx="10" fill="#e8effa" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="690.0" y="192.0" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="600" fill="#172b4d">服务端 / 设备目录</text>
<rect x="910.0" y="145" width="400.0" height="80" rx="10" fill="#e8effa" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="1110.0" y="192.0" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="600" fill="#172b4d">学生 Electron</text>
<rect x="1330.0" y="145" width="400.0" height="80" rx="10" fill="#e8effa" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="1530.0" y="192.0" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="600" fill="#172b4d">Rust 离线守护</text>
<rect x="1118.0" y="240" width="404.0" height="62" rx="10" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="1320.0" y="264.625" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#172b4d">1. 用户登录后启动应用</text>
<text x="1320.0" y="289.275" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#172b4d">等待首次锁定与 IPC 就绪</text>
<rect x="698.0" y="340" width="404.0" height="62" rx="10" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="900.0" y="364.625" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#172b4d">2. 设备凭证认证 + bootId</text>
<text x="900.0" y="389.275" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#172b4d">上报版本，获取策略</text>
<rect x="278.0" y="440" width="404.0" height="62" rx="10" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="480.0" y="464.625" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#172b4d">3. 教师设备注册 / 报告端点</text>
<text x="480.0" y="489.275" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#172b4d">业务操作另验账号权限</text>
<rect x="698.0" y="540" width="404.0" height="62" rx="10" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="900.0" y="564.625" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#172b4d">4. 查询控制教师</text>
<text x="900.0" y="589.275" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#172b4d">机房 / deviceId / controlEpoch</text>
<rect x="698.0" y="640" width="404.0" height="62" rx="10" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="900.0" y="664.625" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#172b4d">5. 返回认证身份、地址</text>
<text x="900.0" y="689.275" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#172b4d">端口、有效期与控制代次</text>
<rect x="278.0" y="740" width="824.0" height="62" rx="10" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="690.0" y="776.95" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#172b4d">6. 学生主动建立控制 WSS；画面需另行授权建连</text>
<rect x="1118.0" y="840" width="404.0" height="62" rx="10" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="1320.0" y="864.625" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#172b4d">7. 有效远端 ack → 本地健康报告</text>
<text x="1320.0" y="889.275" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#172b4d">不把网络职责交给 Rust</text>
<rect x="278.0" y="940" width="404.0" height="62" rx="10" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="480.0" y="964.625" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#172b4d">8. IP 变化：更新端点</text>
<text x="480.0" y="989.275" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#172b4d">或其他教师请求接管</text>
<rect x="698.0" y="1040" width="404.0" height="62" rx="10" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="900.0" y="1064.625" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#172b4d">9. 下发新目录 / 新控制代次</text>
<text x="900.0" y="1089.275" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#172b4d">数据库变更不等于接管完成</text>
<rect x="278.0" y="1140" width="824.0" height="62" rx="10" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="690.0" y="1176.95" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#172b4d">10. 验证新身份，建立新控制连接，拒绝旧代次命令</text>
<rect x="698.0" y="1240" width="404.0" height="62" rx="10" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="900.0" y="1264.625" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#172b4d">11. 确认新代次与连接</text>
<text x="900.0" y="1289.275" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#172b4d">服务器才显示接管成功</text>
<rect x="278.0" y="1340" width="404.0" height="62" rx="10" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="480.0" y="1364.625" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#172b4d">12. 独立流程：申请画面订阅</text>
<text x="480.0" y="1389.275" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#172b4d">控制教师或只读教师均需授权</text>
<rect x="278.0" y="1440" width="404.0" height="62" rx="10" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="480.0" y="1464.625" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#172b4d">13. 返回短期订阅授权</text>
<text x="480.0" y="1489.275" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#172b4d">绑定设备 / 账号 / 范围 / 期限</text>
<rect x="698.0" y="1540" width="404.0" height="62" rx="10" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="900.0" y="1564.625" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#172b4d">14. 下发订阅授权</text>
<text x="900.0" y="1589.275" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#172b4d">教师身份 / 端点 / 有效期</text>
<rect x="278.0" y="1640" width="824.0" height="62" rx="10" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="690.0" y="1676.95" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#172b4d">15. 学生建立独立画面 WSS；校验身份与订阅，教师指定授权内参数</text>
<rect x="278.0" y="1740" width="824.0" height="62" rx="10" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="690.0" y="1776.95" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#172b4d">16. 学生直接传画面；取消、撤销或到期停止，不经服务端中转</text>
<rect x="60" y="1925" width="1680" height="48" rx="10" fill="#fff4dc" stroke="none" stroke-width="1.5"/>
<text x="900.0" y="1955.3" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#172b4d">首次入网须一次性注册码或审批；客户端自报 role=teacher 不会获得教师权限。</text>
<rect x="60" y="1980" width="1680" height="48" rx="10" fill="#fff4dc" stroke="none" stroke-width="1.5"/>
<text x="900.0" y="2010.3" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#172b4d">地址重试、发现请求及接管过程不重置失联期限；任一必需连接 20 秒无有效回应即锁机。</text>
<rect x="60" y="2035" width="1680" height="48" rx="10" fill="#fff4dc" stroke="none" stroke-width="1.5"/>
<text x="900.0" y="2065.3" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#172b4d">无控制教师或目录无效时保持锁定；跨机房需实际放通学生到服务器和教师的指定端口。</text>
<rect x="60" y="2090" width="1680" height="48" rx="10" fill="#fff4dc" stroke="none" stroke-width="1.5"/>
<text x="900.0" y="2120.3" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#172b4d">步骤 12–16 为独立订阅流程；只读教师画面连接不续期控制心跳。离线撤销以短期授权有效期兜底。</text>
</svg>
