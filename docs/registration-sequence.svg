<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1170" viewBox="0 0 1440 1170" role="img" aria-labelledby="title desc">
<title id="title">登记解锁时序</title><desc id="desc">授权、发送和执行分别确认；解锁成功事件由学生直接写入服务端，重复命令不得重复执行</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs>
<rect width="1440" height="1170" fill="#ffffff"/>
<polyline points="200.0,215 200.0,1050" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>
<polyline points="560.0,215 560.0,1050" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>
<polyline points="920.0,215 920.0,1050" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>
<polyline points="1265.0,215 1265.0,1050" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>
<polyline points="200.0,290 560.0,290" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="560.0,390 200.0,390" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="200.0,490 920.0,490" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="920.0,600 1265.0,600" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="1265.0,710 920.0,710" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="920.0,820 560.0,820" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="920.0,920 200.0,920" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="560.0,1020 200.0,1020" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="43" y="51.5" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="600" fill="#172b4d">登记解锁时序</text>
<text x="43" y="91.95" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#172b4d">授权、发送和执行分别确认；解锁成功事件由学生直接写入服务端，重复命令不得重复执行</text>
<rect x="70" y="145" width="260" height="70" rx="10" fill="#e8effa" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="200.0" y="187.7" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="600" fill="#172b4d">教师端</text>
<rect x="430" y="145" width="260" height="70" rx="10" fill="#e8effa" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="560.0" y="187.7" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="600" fill="#172b4d">服务端</text>
<rect x="790" y="145" width="260" height="70" rx="10" fill="#e8effa" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="920.0" y="187.7" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="600" fill="#172b4d">Rust 学生服务</text>
<rect x="1150" y="145" width="230" height="70" rx="10" fill="#e8effa" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="1265.0" y="187.7" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="600" fill="#172b4d">Electron 界面</text>
<rect x="208.0" y="224" width="344.0" height="57" rx="10" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="380.0" y="258.45" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#172b4d">1. 识别确认学生，登记并预留机器</text>
<rect x="208.0" y="324" width="344.0" height="57" rx="10" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="380.0" y="358.45" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#172b4d">2. 返回 Session、操作权与命令授权</text>
<rect x="208.0" y="424" width="704.0" height="57" rx="10" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="560.0" y="458.45" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#172b4d">3. 直连发送解锁命令（commandId / controlEpoch）</text>
<rect x="928.0" y="534" width="329.0" height="57" rx="10" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="1092.5" y="556.125" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#172b4d">4. 校验健康与授权，持久化意图</text>
<text x="1092.5" y="580.775" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#172b4d">通过本地 IPC 执行解锁</text>
<rect x="928.0" y="644" width="329.0" height="57" rx="10" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="1092.5" y="678.45" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#172b4d">5. 确认界面实际切换成功</text>
<rect x="568.0" y="754" width="344.0" height="57" rx="10" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="740.0" y="776.125" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#172b4d">6. 持久化并直接上报</text>
<text x="740.0" y="800.775" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#172b4d">UNLOCK_SUCCEEDED 事件</text>
<rect x="208.0" y="854" width="704.0" height="57" rx="10" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="560.0" y="888.45" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#172b4d">7. 返回同一命令的执行回执</text>
<rect x="208.0" y="954" width="344.0" height="57" rx="10" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="380.0" y="988.45" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#172b4d">8. 更新 Session，提供已确认状态</text>
<rect x="50" y="1080" width="1340" height="65" rx="10" fill="#fff4dc" stroke="none" stroke-width="1.5"/>
<text x="720.0" y="1105.75" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#172b4d">解锁超时：保留预留并查询学生实际状态；不可直接假定失败后释放机器。</text>
<text x="720.0" y="1131.85" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#172b4d">失联、进程退出或授权失效：拒绝解锁；恢复使用需要教师再次授权。</text>
</svg>
