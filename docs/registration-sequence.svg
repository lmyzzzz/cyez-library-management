<text x="43" y="51.5" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="600" fill="#172b4d">04 · 登记、授权与实际解锁时序</text>
<text x="43" y="91.95" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#172b4d">业务授权归 Electron；本地保护许可归 Rust；服务端依据学生持久化事件确认使用开始。</text>
<rect x="70.0" y="145" width="316.0" height="80" rx="10" fill="#e8effa" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="228.0" y="192.0" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="600" fill="#172b4d">教师 Electron</text>
<rect x="406.0" y="145" width="316.0" height="80" rx="10" fill="#e8effa" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="564.0" y="192.0" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="600" fill="#172b4d">服务端 / 数据库</text>
<rect x="742.0" y="145" width="316.0" height="80" rx="10" fill="#e8effa" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="900.0" y="192.0" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="600" fill="#172b4d">学生 Electron 主逻辑</text>
<rect x="1078.0" y="145" width="316.0" height="80" rx="10" fill="#e8effa" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="1236.0" y="192.0" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="600" fill="#172b4d">Rust 离线状态机</text>
<rect x="1414.0" y="145" width="316.0" height="80" rx="10" fill="#e8effa" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="1572.0" y="192.0" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="600" fill="#172b4d">锁机渲染器</text>
<rect x="236.0" y="240" width="320.0" height="62" rx="10" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="396.0" y="264.625" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#172b4d">1. 首次 UID + 人工资料</text>
<text x="396.0" y="289.275" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#172b4d">或日常人脸确认学生</text>
<rect x="236.0" y="340" width="320.0" height="62" rx="10" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="396.0" y="364.625" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#172b4d">2. 登记并预留机器</text>
<text x="396.0" y="389.275" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#172b4d">事务检查学生 / 机器占用</text>
<rect x="236.0" y="440" width="320.0" height="62" rx="10" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="396.0" y="464.625" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#172b4d">3. 返回 Session / 命令授权</text>
<text x="396.0" y="489.275" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#172b4d">commandId / controlEpoch</text>
<rect x="236.0" y="540" width="656.0" height="62" rx="10" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="564.0" y="576.95" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#172b4d">4. 经直连发送授权命令；重试使用同一 commandId</text>
<rect x="765.0" y="642" width="270" height="58" rx="10" fill="#fff4dc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="900.0" y="664.625" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#172b4d">5. 鉴权 / 去重 / 健康检查</text>
<text x="900.0" y="689.275" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#172b4d">持久化命令意图</text>
<rect x="908.0" y="740" width="320.0" height="62" rx="10" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="1068.0" y="764.625" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#172b4d">6. RequestUnlock</text>
<text x="1068.0" y="789.275" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#172b4d">请求 ID / 本地保护代次</text>
<rect x="908.0" y="840" width="320.0" height="62" rx="10" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="1068.0" y="864.625" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#172b4d">7. 本地健康通过，发一次许可</text>
<text x="1068.0" y="889.275" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#172b4d">进入 UNLOCK_PENDING</text>
<rect x="908.0" y="940" width="656.0" height="62" rx="10" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="1236.0" y="976.95" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#172b4d">8. 切换界面：隐藏锁机窗口，应用继续运行</text>
<rect x="908.0" y="1040" width="656.0" height="62" rx="10" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="1236.0" y="1076.95" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#172b4d">9. 返回实际界面切换结果；不是仅确认收到消息</text>
<rect x="908.0" y="1140" width="320.0" height="62" rx="10" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="1068.0" y="1164.625" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#172b4d">10. ConfirmUnlocked</text>
<text x="1068.0" y="1189.275" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#172b4d">匹配请求 / 保护代次</text>
<rect x="908.0" y="1240" width="320.0" height="62" rx="10" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="1068.0" y="1264.625" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#172b4d">11. 原子确认 UNLOCKED</text>
<text x="1068.0" y="1289.275" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#172b4d">新故障优先于旧确认</text>
<rect x="765.0" y="1342" width="270" height="58" rx="10" fill="#fff4dc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="900.0" y="1364.625" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#172b4d">12. SQLite 事务落盘</text>
<text x="900.0" y="1389.275" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#172b4d">UNLOCK_SUCCEEDED</text>
<rect x="572.0" y="1440" width="320.0" height="62" rx="10" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="732.0" y="1464.625" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#172b4d">13. 直接批量上报学生事件</text>
<text x="732.0" y="1489.275" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#172b4d">服务端事务更新 Session</text>
<rect x="572.0" y="1540" width="320.0" height="62" rx="10" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="732.0" y="1564.625" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#172b4d">14. 持久化后确认 eventId</text>
<text x="732.0" y="1589.275" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#172b4d">应用再回收发送队列</text>
<rect x="236.0" y="1640" width="656.0" height="62" rx="10" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="564.0" y="1676.95" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#172b4d">15. 回执关联原命令；教师从服务端获取最终业务状态</text>
<rect x="60" y="1825" width="1680" height="48" rx="10" fill="#fff4dc" stroke="none" stroke-width="1.5"/>
<text x="900.0" y="1855.3" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#172b4d">仅收到 Rust 许可不算解锁成功；实际界面与本地状态均确认后，才生成使用开始事件。</text>
<rect x="60" y="1880" width="1680" height="48" rx="10" fill="#fff4dc" stroke="none" stroke-width="1.5"/>
<text x="900.0" y="1910.3" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#172b4d">超时或回执丢失：保留机器预留并查询同一命令，不直接当成失败后释放机器。</text>
<rect x="60" y="1935" width="1680" height="48" rx="10" fill="#fff4dc" stroke="none" stroke-width="1.5"/>
<text x="900.0" y="1965.3" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#172b4d">任何阶段故障锁定都会递增本地保护代次，旧许可或迟到确认不得重新放行。</text>
</svg>
