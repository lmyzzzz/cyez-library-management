<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1735" viewBox="0 0 1800 1735" role="img" aria-labelledby="title desc">
<title id="title">08 · 守护事实、业务事件与可靠补报</title><desc id="desc">两级本地持久化与服务端去重：所有网络上报由 Electron 完成，守护从不直接连接服务器。</desc>
