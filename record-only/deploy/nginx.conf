pid /tmp/nginx.pid;
worker_processes auto;
error_log /var/log/cyez/error.log warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  # Only status and timing: never URL, query, body, cookies or headers.
  log_format safe escape=json '{"at":"$msec","status":$status,"elapsed":"$request_time"}';
  access_log /var/log/cyez/access.jsonl safe;
  limit_req_zone $binary_remote_addr zone=login:1m rate=10r/m;
  server {
    listen 8443 ssl;
    server_tokens off;
    # Docker's embedded DNS is 127.0.0.11. Resolve api at request time instead
    # of caching the container IP at startup, so a recreated api is reached
    # without recreating the gateway. Answers are cached for at most 10s.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    # Variable upstream forces runtime resolution. $request_uri preserves the
    # original path and query string; with variables nginx would otherwise not
    # pass the original URI unchanged.
    set $api_upstream api;
    ssl_certificate /run/secrets/tls_cert;
    ssl_certificate_key /run/secrets/tls_key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 64k;
    client_body_buffer_size 64k;
    client_body_in_file_only off;
    client_body_timeout 10s;
    proxy_connect_timeout 5s;
    proxy_read_timeout 20s;
    proxy_send_timeout 20s;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_cache off;
    proxy_set_header Host api;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    location = /api/v1/auth/login {
      limit_req zone=login burst=5 nodelay;
      proxy_pass http://$api_upstream:3000$request_uri;
    }
    location ~ ^/api/v1/(auth/(login|logout)|clients/startup|provider-config|scan-previews(/[0-9a-f-]+)?|devices(/[0-9a-f-]+)?|tags(/[0-9a-f-]+)?|usage-records(/.*)?|operations/[0-9a-f-]+|service-status|logs/batch)$ {
      proxy_pass http://$api_upstream:3000$request_uri;
    }
    location ~ ^/health/(live|ready)$ {
      proxy_pass http://$api_upstream:3000$request_uri;
    }
    location / { return 404; }
  }
}
